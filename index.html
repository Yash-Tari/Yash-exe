<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taalchakra Attendance</title>
  <style>
    /* ===== Base & Reset ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #cc3300;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #2a2a2a;
    }

    /* ===== Container ===== */
    .panel {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      width: 95%;
      max-width: 430px;
      padding: 2rem 2rem 2.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      min-height: 460px;
    }

    /* ===== Logo ===== */
    .logo {
      width: 140px;
      margin: 0 auto 0.8rem;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
    }

    /* ===== Titles and Text ===== */
    h2 {
      color: #6b0f00; /* Darker maroon */
      font-weight: 700;
      font-size: 1.85rem;
      margin: 0 0 0.3rem;
      letter-spacing: 0.03em;
      font-family: 'Segoe UI Semibold', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .instructions {
      font-size: 1rem;
      color: #444;
      margin: 0 0 1rem;
      font-weight: 600;
    }

    /* ===== Inputs ===== */
    input[type="text"] {
      width: 100%;
      padding: 0.7rem 1rem;
      font-size: 1.05rem;
      border-radius: 8px;
      border: 1.5px solid #ccc;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      outline: none;
      font-weight: 600;
      color: #444;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    input[type="text"]::placeholder {
      color: #999;
      font-weight: 400;
    }

    input[type="text"]:focus {
      border-color: #6b0f00;
      box-shadow: 0 0 10px #6b0f0077;
    }

    /* ===== Buttons Container ===== */
    .buttons {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    /* ===== Buttons ===== */
    button {
      flex: 1 1 45%;
      min-width: 120px;
      background-color: #6b0f00;
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 0.75rem 1.2rem;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 5px 10px rgba(107, 15, 0, 0.45);
      transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      letter-spacing: 0.04em;
    }

    button:hover:not(:disabled) {
      background-color: #8a1800;
      box-shadow: 0 8px 18px rgba(138, 24, 0, 0.75);
      transform: translateY(-3px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      box-shadow: none;
      background-color: #b35743;
    }

    /* ===== Contact Buttons ===== */
    .contact {
      margin-top: 1.6rem;
      display: flex;
      justify-content: space-around;
      gap: 1rem;
    }

    .contact button {
      flex: 1;
      min-width: 100px;
      background-color: #f5f5f5;
      color: #6b0f00;
      border: 2.5px solid #6b0f00;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.5rem 0.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      user-select: none;
    }

    .contact button:hover {
      background-color: #6b0f00;
      color: #fff;
      border-color: #8a1800;
      box-shadow: 0 5px 12px rgba(138, 24, 0, 0.5);
    }

    .icon-img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      vertical-align: middle;
      filter: brightness(0) saturate(100%) invert(28%) sepia(82%) saturate(2200%) hue-rotate(1deg) brightness(95%) contrast(105%);
      transition: filter 0.3s ease;
      user-select: none;
    }

    .contact button:hover .icon-img {
      filter: brightness(0) saturate(100%) invert(95%) sepia(3%) saturate(0%) hue-rotate(1deg) brightness(100%) contrast(100%);
    }

    /* Responsive tweaks */
    @media (max-width: 400px) {
      .panel {
        padding: 1.7rem 1.5rem 2rem;
      }

      .buttons {
        flex-direction: column;
        gap: 0.75rem;
      }

      /* Submit button full width */
      .btn-submit {
        flex: 1 1 100%;
        min-width: unset;
      }

      /* Place clear and close below submit */
      .btn-clear,
      .btn-close {
        flex: 1 1 100%;
        min-width: unset;
      }

      .contact {
        flex-direction: column;
        gap: 0.75rem;
      }

      .contact button {
        min-width: unset;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="panel" id="attendancePanel">
    <img src="Taalchakra Logo_Maroon_2024.png" alt="Taalchakra Logo" class="logo" />
    <h2>Taalchakra Attendance</h2>
    <p class="instructions">Please enter your first and last name</p>
    <input type="text" id="firstNameInput" placeholder="First name" autocomplete="given-name" />
    <input type="text" id="lastNameInput" placeholder="Last name" autocomplete="family-name" />
    <div class="buttons">
      <button class="btn-submit" id="submitBtn" onclick="submitAttendance()">Submit</button>
      <button class="btn-clear" id="clearBtn" onclick="clearForm()">Clear</button>
      <button class="btn-close" id="closeBtn" onclick="closeUI()">Close</button>
    </div>
    <p id="status" style="white-space: pre-line; font-weight: 600; min-height: 3em; color: #6b0f00;"></p>

    <div class="contact" aria-label="Contact information">
      <button title="Call us" onclick="callNumber()">
        <img src="outcoming-call_6730844.png" alt="icon" class="icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
        <span class="fallback-text">Call</span>
      </button>
      <button title="Copy email to clipboard" onclick="copyEmail()">
        <img src="mail-icon_8056414.png" alt="icon" class="icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
        <span class="fallback-text">Email</span>
      </button>
      <button title="Visit Instagram" onclick="openInstagram()">
        <img src="instagram_725339.png" alt="icon" class="icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
        <span class="fallback-text">Instagram</span>
      </button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzek8wbWkUh_Mi5ASm42h5zZS84oPJsZFcGl_G0b64a-pbkv8CNO0gDnBSUqz4ezBfJAA/exec';
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const attendancePanel = document.getElementById('attendancePanel');

    function clearForm() {
      document.getElementById('firstNameInput').value = '';
      document.getElementById('lastNameInput').value = '';
      status.innerText = '';
      submitBtn.disabled = false;
    }

    function closeUI() {
      attendancePanel.style.display = 'none';
    }

    function callNumber() {
      window.location.href = 'tel:+917038252585'; // Replace with your actual phone number
    }

    function copyEmail() {
      const email = 'taalchakradholtashapathak@gmail.com'; // Replace with your actual email
      navigator.clipboard.writeText(email).then(() => {
        alert(`Email address copied: ${email}`);
      }).catch(() => {
        alert('Failed to copy email. Please copy manually.');
      });
    }

    function openInstagram() {
      window.open('https://www.instagram.com/taalchakra_dhol_tasha_pathak?igsh=NDMwczNqcmxpNWE=', '_blank');
    }

    async function submitAttendance() {
      const firstName = document.getElementById('firstNameInput').value.trim();
      const lastName = document.getElementById('lastNameInput').value.trim();

      if (!firstName || !lastName) {
        status.innerText = 'Please enter both first and last name.';
        return;
      }

      if (!navigator.geolocation) {
        status.innerText = 'Geolocation not supported.';
        return;
      }

      status.innerText = 'Getting location...';
      submitBtn.disabled = true;

      navigator.geolocation.getCurrentPosition(async position => {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        status.innerText = `Your location: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;

        try {
          const formData = new FormData();
          formData.append("firstName", firstName);
          formData.append("lastName", lastName);
          formData.append("latitude", latitude);
          formData.append("longitude", longitude);

          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: formData
          });

          const data = await response.json();
          console.log("Server response:", data);

          if (data.status === 'success') {
            status.innerText += data.locationMatch === '✅'
              ? '\nPresent\nWithin location'
              : '\nPresent\nOut of location';

            // Auto-close after 3 seconds
            setTimeout(() => {
              closeUI();
            }, 3000);

          } else if (data.status === 'already_marked') {
            status.innerText += '\nYou have already marked attendance today.';
            submitBtn.disabled = false;
          } else if (data.status === 'out_of_time') {
            status.innerText = 'Attendance can only be marked between 6:30 PM and 9 PM IST.';
            submitBtn.disabled = false;
          } else {
            status.innerText = data.message || 'Error: Could not mark attendance.';
            submitBtn.disabled = false;
          }

        } catch (error) {
          console.error(error);
          status.innerText = 'Network or server error. Please try again.';
          submitBtn.disabled = false;
        }
      }, error => {
        console.error(error);
        status.innerText = 'Location access denied or unavailable.';
        submitBtn.disabled = false;
      }, {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      });
    }
  </script>
</body>
</html>
