<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taalchakra Attendance</title>
  <style>
    /* ===== Base & Reset ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #cc3300;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #2a2a2a;
    }

    /* ===== Container ===== */
    .panel {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      width: 95%;
      max-width: 430px;
      padding: 2rem 2rem 2.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      min-height: 460px;
    }

    /* ===== Logo ===== */
    .logo {
      width: 240px;
      margin: 0 auto 0.2rem;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
    }

    /* ===== Titles and Text ===== */
    h2 {
      color: #6b0f00; /* Darker maroon */
      font-weight: 700;
      font-size: 1.85rem;
      margin: 0 0 0.1rem;
      letter-spacing: 0.03em;
      font-family: 'Segoe UI Semibold', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .instructions {
      font-size: 1rem;
      color: #444;
      margin: 0 0 1rem;
      font-weight: 600;
    }

    /* ===== Inputs ===== */
    input[type="text"] {
      width: 100%;
      padding: 0.7rem 1rem;
      font-size: 1.05rem;
      border-radius: 8px;
      border: 1.5px solid #ccc;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      outline: none;
      font-weight: 600;
      color: #444;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    input[type="text"]::placeholder {
      color: #999;
      font-weight: 400;
    }

    input[type="text"]:focus {
      border-color: #6b0f00;
      box-shadow: 0 0 10px #6b0f0077;
    }

/* ===== Buttons Container ===== */
.buttons {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-top: 1rem;
}

/* ===== Submit Button ===== */
button.btn-submit {
  background-color: #6b0f00; /* maroon */
  color: white;
  font-size: 1.3rem;
  font-weight: 500;
  padding: 1rem 0;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(107, 15, 0, 0.4);
  transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
  width: 100%;
  max-width: none;
  letter-spacing: 0.05em;
  height: 48px; /* fixed height */
  line-height: 48px;
}

button.btn-submit:hover:not(:disabled) {
  background-color: #8a1800;
  box-shadow: 0 8px 20px rgba(138, 24, 0, 0.7);
  transform: translateY(-3px);
}

button.btn-submit:active:not(:disabled) {
  transform: translateY(0);
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
}

/* ===== Clear and Close Buttons Container ===== */
.buttons .secondary-buttons {
  display: flex;
  gap: 1rem;
  justify-content: center;
}

/* ===== Clear and Close Buttons ===== */
button.btn-clear,
button.btn-close {
  background-color: transparent;
  border: 2.5px solid #6b0f00;
  color: #6b0f00;
  font-weight: 700;
  font-size: 1.05rem;
  padding: 0;
  border-radius: 12px;
  cursor: pointer;
  flex: 1; /* share equal width */
  box-shadow: none;
  transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  letter-spacing: 0.04em;
  height: 48px; /* same height as submit */
  line-height: 48px;
}

button.btn-clear:hover,
button.btn-close:hover {
  background-color: #6b0f00;
  color: white;
  border-color: #8a1800;
  box-shadow: 0 5px 12px rgba(138, 24, 0, 0.5);
}

button.btn-clear:active,
button.btn-close:active {
  background-color: #8a1800;
  border-color: #4a0a00;
}

/* ===== Shared Button Height and Line Height ===== */
button.btn-submit,
button.btn-clear,
button.btn-close {
  height: 48px;
  line-height: 48px;
  padding: 0; /* ensure no vertical stretching */
}

/* Responsive tweaks */
@media (max-width: 400px) {
  .buttons .secondary-buttons {
    gap: 0.75rem;
  }
}



    /* ===== Contact Buttons ===== */
    .contact {
      margin-top: 1.6rem;
      margin-bottom: 2.5rem;
      display: flex;
      justify-content: space-around;
      gap: 1rem;
    }

    .contact button {
      flex: 1;
      min-width: 100px;
      background-color: #f5f5f5;
      color: #6b0f00;
      border: 2.5px solid #6b0f00;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.5rem 0.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      user-select: none;
    }

    .contact button:hover {
      background-color: #6b0f00;
      color: #fff;
      border-color: #8a1800;
      box-shadow: 0 5px 12px rgba(138, 24, 0, 0.5);
    }

    .icon-img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      vertical-align: middle;
      filter: brightness(0) saturate(100%) invert(28%) sepia(82%) saturate(2200%) hue-rotate(1deg) brightness(95%) contrast(105%);
      transition: filter 0.3s ease;
      user-select: none;
    }

    .contact button:hover .icon-img {
      filter: brightness(0) saturate(100%) invert(95%) sepia(3%) saturate(0%) hue-rotate(1deg) brightness(100%) contrast(100%);
    }

    /* Responsive tweaks */
    @media (max-width: 400px) {
      .panel {
        padding: 1.7rem 1.5rem 2rem;
      }

      .buttons {
        flex-direction: column;
        gap: 0.75rem;
      }

      /* Submit button full width */
      .btn-submit {
        flex: 1 1 100%;
        min-width: unset;
      }

      /* Place clear and close below submit */
      .btn-clear,
      .btn-close {
        flex: 1 1 100%;
        min-width: unset;
      }

      .contact {
        flex-direction: column;
        gap: 0.75rem;
      }

      .contact button {
        min-width: unset;
        width: 100%;
      }
    }

#confirmation {
  display: none;
  text-align: center;
  margin-top: 1.5rem;
  background: #fff8f5;
  padding: 1.5rem 2rem;
  border-radius: 12px;
  box-shadow: 0 6px 15px rgba(107, 15, 0, 0.3);
  color: #6b0f00;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}
.loader {
  border: 6px solid #f3f3f3;
  border-top: 6px solid #6b0f00;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  animation: spin 1s linear infinite;
  margin: 0 auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

  #loadingOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 255, 255, 0.8);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: 'Segoe UI', sans-serif;
    font-size: 1.2rem;
    color: #6b0f00;
    font-weight: 600;
    text-align: center;
  }

  #status {
    display: none; /* Hidden initially */
    white-space: pre-line;
    font-weight: 600;
    min-height: 3em;
    color: #6b0f00;
    background-color: #fff8f5;
    padding: 1rem;
    border-radius: 10px;
    box-shadow: 0 4px 12px rgba(107, 15, 0, 0.15);
    margin-top: 1rem;
    text-align: center;
  }
      #suggestions {
        border: 1px solid #ccc;
        display: none;
        position: absolute;
        background: white;
        max-height: 150px;
        overflow-y: auto;
        width: 100%;
      }
      #suggestions div {
        padding: 5px;
        cursor: pointer;
      }
      #suggestions div:hover {
        background-color: #f0f0f0;
      }



  </style>
</head>
<div id="loadingOverlay">
  <div style="margin-bottom: 1rem;">Submitting your attendance...</div>
  <div class="loader"></div>
</div>


<body>
  <div class="panel" id="attendancePanel">
    <img src="Taalchakra Logo_Maroon_2024.png" alt="Taalchakra Logo" class="logo" />
    <h2>Taalchakra Attendance 2</h2>
    <p class="instructions">Please enter your first and last name</p>
    <input type="text" id="firstNameInput" onkeyup="showSuggestions()" placeholder="First name" autocomplete="off" />
    <input type="text" id="lastNameInput" onkeyup="showSuggestions()" placeholder="Last name" autocomplete="off" />
    <div id="suggestions"></div>
    <div class="buttons">
      <button class="btn-submit" id="submitBtn" onclick="submitAttendance()">Submit</button>
      <div class="secondary-buttons">
        <button class="btn-clear" id="clearBtn" onclick="clearForm()">Clear</button>
        <button class="btn-close" id="closeBtn" onclick="closeUI()">Close</button>
      </div>
    </div>
    <p id="status" style="white-space: pre-line; font-weight: 600; min-height: 3em; color: #6b0f00;"></p>

    <div class="contact" aria-label="Contact information">
      <button title="Call us" onclick="callNumber()">
        <img src="outcoming-call_6730844.png" alt="icon" class="icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
        <span class="fallback-text">Call</span>
      </button>
      <button title="Copy email to clipboard" onclick="copyEmail()">
        <img src="mail-icon_8056414.png" alt="icon" class="icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
        <span class="fallback-text">Email</span>
      </button>
      <button title="Visit Instagram" onclick="openInstagram()">
        <img src="instagram_725339.png" alt="icon" class="icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
        <span class="fallback-text">Instagram</span>
      </button>
    </div>
   <div id="datetime" style="position: absolute; bottom: 1rem; right: 1.5rem; font-weight: 600; font-size: 0.95rem; color: #555;"></div>
  </div>

  
  <div id="confirmation" style="display:none; text-align: center; margin-top: 1.5rem;">
    <h3>Attendance Confirmed</h3>
    <p><strong>Name:</strong> <span id="confName"></span></p>
    <p><strong>Time:</strong> <span id="confTime"></span></p>
    <p><strong>Status:</strong> <span id="confStatus"></span></p>
    <button onclick="closeConfirmation()" style="margin-top: 1rem; padding: 0.5rem 1rem; border:none; background:#6b0f00; color:white; border-radius:8px; cursor:pointer;">OK</button>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzek8wbWkUh_Mi5ASm42h5zZS84oPJsZFcGl_G0b64a-pbkv8CNO0gDnBSUqz4ezBfJAA/exec';
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const attendancePanel = document.getElementById('attendancePanel');

    function showStatus(message) {
      const statusDiv = document.getElementById('status');
      if (message && message.trim() !== "") {
        statusDiv.style.display = 'block';
        statusDiv.textContent = message;
      } else {
        statusDiv.style.display = 'none';
        statusDiv.textContent = '';
      }
    }


    function clearForm() {
      document.getElementById('firstNameInput').value = '';
      document.getElementById('lastNameInput').value = '';
      showStatus('');
      submitBtn.disabled = false;
    }

    function closeUI() {
      attendancePanel.style.display = 'none';
    }

    function callNumber() {
      window.location.href = 'tel:+917038252585'; // Replace with your actual phone number
    }

    function copyEmail() {
      const email = 'taalchakradholtashapathak@gmail.com'; // Replace with your actual email
      navigator.clipboard.writeText(email).then(() => {
        alert(`Email address copied: ${email}`);
      }).catch(() => {
        alert('Failed to copy email. Please copy manually.');
      });
    }

    function openInstagram() {
      window.open('https://www.instagram.com/taalchakra_dhol_tasha_pathak?igsh=NDMwczNqcmxpNWE=', '_blank');
    }
function showOverlay() {
  document.getElementById('loadingOverlay').style.display = 'flex';
}

function hideOverlay() {
  document.getElementById('loadingOverlay').style.display = 'none';
}

  async function submitAttendance() {
  const firstName = document.getElementById('firstNameInput').value.trim();
  const lastName = document.getElementById('lastNameInput').value.trim();

  if (!firstName || !lastName) {
    showStatus('Please enter both first and last name.');
    return;
  }

  if (!navigator.geolocation) {
    showStatus('Geolocation not supported.');
    return;
  }

  showStatus('Getting location...');
  submitBtn.disabled = true;

 showOverlay(); 

  navigator.geolocation.getCurrentPosition(async position => {
    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;
    
    showStatus('Submitting your attendance...');

    try {
      const formData = new FormData();
      formData.append("firstName", firstName);
      formData.append("lastName", lastName);
      formData.append("latitude", latitude);
      formData.append("longitude", longitude);

      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: formData
      });

      const data = await response.json();
      console.log("Server response:", data);

       hideOverlay();

      if (data.status === 'success') {
        status.innerText += data.locationMatch === '✅'
          ? '\nPresent\nWithin location'
          : '\nPresent\nOut of location';

        // Show confirmation panel with details instead of auto-close
        attendancePanel.style.display = 'none';

        document.getElementById('confirmation').style.display = 'block';

        document.getElementById('confName').innerText = firstName + ' ' + lastName;

        const now = new Date();
        const options = {
          year: 'numeric', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit',
          hour12: true, timeZone: 'Asia/Kolkata'
        };
        document.getElementById('confTime').innerText = now.toLocaleString('en-IN', options);

        if (data.locationMatch === '✅') {
          document.getElementById('confStatus').innerText = 'Within Location';
          document.getElementById('confStatus').style.color = 'green';
        } else {
          document.getElementById('confStatus').innerText = 'Outside Location';
          document.getElementById('confStatus').style.color = 'red';
        }

        // Removed auto-close timeout
        // setTimeout(() => {
        //   closeUI();
        // }, 3000);

      } else if (data.status === 'already_marked') {
       showStatus(status.innerText + '\nYou have already marked attendance today.');
        submitBtn.disabled = false;
      } else if (data.status === 'out_of_time') {
        showStatus('Attendance can only be marked between 6:30 PM and 9 PM IST.');
        submitBtn.disabled = false;
      } else {
        showStatus(data.message || 'Error: Could not mark attendance.');
        submitBtn.disabled = false;
      }

    } catch (error) {
      console.error(error);
     showStatus('Network or server error. Please try again.');
      submitBtn.disabled = false;
      hideOverlay();
    }
  }, error => {
    console.error(error);
    showStatus('Location access denied or unavailable.');
    submitBtn.disabled = false;
    hideOverlay();
  }, {
    enableHighAccuracy: true,
    timeout: 15000,
    maximumAge: 0
  });
}


  function updateDateTime() {
    const now = new Date();
    const options = {
      year: 'numeric',
      month: 'short',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: true,
      timeZone: 'Asia/Kolkata'
    };
    document.getElementById('datetime').innerText = now.toLocaleString('en-IN', options);
  }
  updateDateTime();
  setInterval(updateDateTime, 1000); // update every second

function closeConfirmation() {
  document.getElementById('confirmation').style.display = 'none';
  attendancePanel.style.display = 'flex'; // show form again if you want
  clearForm();
}

  </script>

  <script>
  let nameList = [];

  // Load name list on page load
  google.script.run.withSuccessHandler(function(data) {
    nameList = data;
    console.log("Loaded names:", nameList);
  }).getNames();

  function showSuggestions() {
    const firstInput = document.getElementById("firstNameInput").value.trim().toLowerCase();
    const lastInput = document.getElementById("lastNameInput").value.trim().toLowerCase();

    const suggestions = nameList.filter(nameObj => {
      const firstMatch = nameObj.firstName.toLowerCase().startsWith(firstInput);
      const lastMatch = nameObj.lastName.toLowerCase().startsWith(lastInput);

      // If both fields have input, match both
      if (firstInput && lastInput) return firstMatch && lastMatch;

      // If only one is typed, match that
      if (firstInput) return firstMatch;
      if (lastInput) return lastMatch;

      return false;
    });

    // Display results
    const suggestionBox = document.getElementById("suggestions");
    suggestionBox.innerHTML = suggestions.map(n => `<div>${n.fullName}</div>`).join("");
  }
</script>

</body>
</html>
