<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taalchakra Attendance</title>
  <style>
  /* ===== Base & Reset ===== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: #cc3300;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #333;
}

/* ===== Container ===== */
.panel {
  background: white;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  width: 90%;
  max-width: 400px;
  padding: 2.5rem 2rem 3rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
  position: relative;
}

/* ===== Logo ===== */
.logo {
  width: 160px;
  margin: 0 auto 1.4rem;
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
}

/* ===== Titles and Text ===== */
h2 {
  color: #cc3300;
  font-weight: 700;
  font-size: 1.9rem;
  margin: 0 0 0.4rem;
}

.instructions {
  font-size: 1rem;
  color: #444;
  margin: 0 0 1.2rem;
}

/* ===== Inputs ===== */
input[type="text"] {
  width: 100%;
  padding: 0.75rem 1rem;
  font-size: 1.1rem;
  border-radius: 8px;
  border: 1.5px solid #ccc;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
  outline: none;
}

input[type="text"]:focus {
  border-color: #cc3300;
  box-shadow: 0 0 8px #cc3300aa;
}

/* ===== Buttons Container ===== */
.buttons {
  display: flex;
  gap: 0.75rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 1.2rem;
}

/* ===== Buttons ===== */
button {
  flex: 1 1 45%;
  min-width: 120px;
  background-color: #cc3300;
  border: none;
  border-radius: 10px;
  color: white;
  font-weight: 600;
  font-size: 1.05rem;
  padding: 0.75rem 1rem;
  cursor: pointer;
  user-select: none;
  box-shadow: 0 3px 7px rgba(0, 0, 0, 0.14);
  transition: background-color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
}

button:hover:not(:disabled) {
  background-color: #b32a00;
  box-shadow: 0 5px 14px rgba(179, 42, 0, 0.6);
  transform: translateY(-2px);
}

button:active:not(:disabled) {
  transform: translateY(0);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

/* ===== Responsive ===== */
@media (max-width: 400px) {
  .panel {
    padding: 2rem 1.5rem 2.5rem;
  }

  button {
    flex: 1 1 100%;
  }
}

  .icon-img {
    width: 24px;
    height: 24px;
    object-fit: contain;
    margin-right: 6px;
    vertical-align: middle;
    filter: brightness(0) saturate(100%) invert(27%) sepia(83%) saturate(2236%) hue-rotate(1deg) brightness(98%) contrast(102%);
    /* The filter tries to replicate your maroon color. Adjust if needed. */
    transition: filter 0.3s ease;
  }
  
  .contact button:hover .icon-img {
    filter: brightness(0) saturate(100%) invert(35%) sepia(82%) saturate(2103%) hue-rotate(2deg) brightness(92%) contrast(93%);
  }


  </style>
</head>
<body>
  <div class="panel" id="attendancePanel">
    <img src="Taalchakra Logo_Maroon_2024.png" alt="Taalchakra Logo" class="logo" />
    <h2>Taalchakra Attendance 014</h2>
    <p class="instructions">Please enter your name and click Submit</p>
    <input type="text" id="firstNameInput" placeholder="First name" autocomplete="given-name" />
    <input type="text" id="lastNameInput" placeholder="Last name" autocomplete="family-name" />
    <div class="buttons">
      <button class="btn-submit" id="submitBtn" onclick="submitAttendance()">Submit</button>
      <button class="btn-clear" id="clearBtn" onclick="clearForm()">Clear</button>
      <button class="btn-close" id="closeBtn" onclick="closeUI()">Close</button>
    </div>
    <p id="status"></p>

  <div class="contact" aria-label="Contact information">
    <button title="Call us" onclick="callNumber()">
      <img src="outcoming-call_6730844.png" alt="Call icon" class="icon-img" />
      Call
    </button>
    <button title="Copy email to clipboard" onclick="copyEmail()">
      <img src="mail-icon_8056414.png" alt="Email icon" class="icon-img" />
      Email
    </button>
    <button title="Visit Instagram" onclick="openInstagram()">
      <img src="instagram_725339.png" alt="Instagram icon" class="icon-img" />
      Instagram
    </button>
  </div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzek8wbWkUh_Mi5ASm42h5zZS84oPJsZFcGl_G0b64a-pbkv8CNO0gDnBSUqz4ezBfJAA/exec';
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const attendancePanel = document.getElementById('attendancePanel');

    function clearForm() {
      document.getElementById('firstNameInput').value = '';
      document.getElementById('lastNameInput').value = '';
      status.innerText = '';
      submitBtn.disabled = false;
    }

    function closeUI() {
      attendancePanel.style.display = 'none';
    }

    function callNumber() {
      window.location.href = 'tel:+917038252585'; // Replace with your actual phone number
    }

    function copyEmail() {
      const email = 'taalchakradholtashapathak@gmail.com'; // Replace with your actual email
      navigator.clipboard.writeText(email).then(() => {
        alert(`Email address copied: ${email}`);
      }).catch(() => {
        alert('Failed to copy email. Please copy manually.');
      });
    }

    function openInstagram() {
      window.open('https://www.instagram.com/taalchakra_dhol_tasha_pathak?igsh=NDMwczNqcmxpNWE=', '_blank');
    }

    async function submitAttendance() {
      const firstName = document.getElementById('firstNameInput').value.trim();
      const lastName = document.getElementById('lastNameInput').value.trim();

      if (!firstName || !lastName) {
        status.innerText = '❌ Please enter both first and last name.';
        return;
      }

      if (!navigator.geolocation) {
        status.innerText = '❌ Geolocation not supported.';
        return;
      }

      status.innerText = '📍 Getting location...';
      submitBtn.disabled = true;

      navigator.geolocation.getCurrentPosition(async position => {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        status.innerText = `📍 Your location: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;

        try {
          const formData = new FormData();
          formData.append("firstName", firstName);
          formData.append("lastName", lastName);
          formData.append("latitude", latitude);
          formData.append("longitude", longitude);

          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: formData
          });

          const data = await response.json();
          console.log("Server response:", data);

          if (data.status === 'success') {
            status.innerText += data.locationMatch === '✅'
              ? '\n✅ Attendance recorded successfully!'
              : '\n⚠️ Attendance recorded, but location is outside allowed area.';

            // Auto-close after 3 seconds
            setTimeout(() => {
              closeUI();
            }, 3000);

          } else if (data.status === 'already_marked') {
            status.innerText += '\n📌 You have already marked attendance today.';
            submitBtn.disabled = false;
          } else if (data.status === 'invalid_name') {
            status.innerText += `\n❌ ${data.message}`;
            submitBtn.disabled = false;
          } else {
            status.innerText += '\n❌ Unknown server response.';
            submitBtn.disabled = false;
          }

        } catch (err) {
          console.error("Fetch failed:", err);
          status.innerText = `❌ Network error: ${err.message}`;
          submitBtn.disabled = false;
        }

      }, error => {
        console.error("Geolocation error:", error);
        status.innerText = '❌ Location access denied or unavailable.';
        submitBtn.disabled = false;
      });
    }
  </script>
</body>
</html>
