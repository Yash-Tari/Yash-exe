<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Taalchakra Attendance</title>
  <style>
    body {
      margin: 0;
      background-color: #cc3300;
      font-family: "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #330000;
    }

    .container {
      background-color: #ffd9cc;
      padding: 2rem;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 400px;
    }

    img.logo {
      max-width: 180px;
      margin-bottom: 1rem;
    }

    h2 {
      margin-bottom: 0.5rem;
    }

    input {
      font-size: 1rem;
      padding: 0.6rem;
      width: 80%;
      margin-bottom: 1rem;
      border: 1px solid #cc3300;
      border-radius: 5px;
    }

    button {
      font-size: 1.1rem;
      padding: 0.6rem 1.5rem;
      background-color: #cc3300;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #b32b00;
    }

    #status {
      margin-top: 1rem;
      font-weight: bold;
      color: #660000;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="Taalchakra Logo_Maroon_2024.png" alt="Taalchakra Logo" class="logo">
    <h2>Taalchakra Attendance 007</h2>
    <p>Please enter your name and click Submit</p>
    <input type="text" id="nameInput" placeholder="Enter your name" required />
    <br>
    <button onclick="submitAttendance()">Submit Attendance</button>
    <p id="status"></p>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzek8wbWkUh_Mi5ASm42h5zZS84oPJsZFcGl_G0b64a-pbkv8CNO0gDnBSUqz4ezBfJAA/exec';

    async function submitAttendance() {
      const name = document.getElementById('nameInput').value.trim();
      const status = document.getElementById('status');
      
      if (!name) {
        status.innerText = '❌ Please enter your name.';
        return;
      }

      if (!navigator.geolocation) {
        status.innerText = '❌ Geolocation not supported.';
        return;
      }

      status.innerText = '📍 Getting location...';

      navigator.geolocation.getCurrentPosition(async position => {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        status.innerText = `📍 Your location: ${latitude}, ${longitude}`;

        try {
          const formData = new FormData();
          formData.append("name", name);
          formData.append("latitude", latitude);
          formData.append("longitude", longitude);
          
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: formData
          });

          const data = await response.json();
          console.log("Server response:", data);

          if (data.status === 'success') {
            if (data.locationMatch === '✅') {
              status.innerText += '\n✅ Attendance recorded successfully!';
            } else {
              status.innerText += '\n⚠️ Attendance recorded, but location is outside allowed area.';
            }
          } else if (data.status === 'already_marked') {
            status.innerText += '\n📌 You have already marked attendance today.';
          } else if (data.status === 'error') {
            status.innerText += `\n❌ Server error: ${data.message}`;
          } else {
            status.innerText += '\n❌ Unknown server response.';
          }

        } catch (err) {
          console.error("Fetch failed:", err);
          status.innerText = `❌ Network error: ${err.message}`;
        }

      }, error => {
        console.error("Geolocation error:", error);
        status.innerText = '❌ Location access denied or unavailable.';
      });
    }
  </script>
</body>
</html>
