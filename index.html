<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Taalchakra Attendance</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
    }
    input, button {
      font-size: 1.2rem;
      padding: 0.5rem;
      margin: 0.5rem;
    }
    #status {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Taalchakra Attendance</h2>
  <p>Please enter your name and click Submit</p>

  <input type="text" id="nameInput" placeholder="Enter your name" required />
  <br>
  <button onclick="submitAttendance()">Submit Attendance</button>

  <p id="status"></p>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwKrdhFMpLuzIV-iRH-5t9p6Ti9uBFxGUA1i3RdQIe2vjkuJMNqV3tEtcS6S_ac6OhdlQ/exec'; // ← replace this

    function submitAttendance() {
      const name = document.getElementById('nameInput').value.trim();
      const status = document.getElementById('status');
      if (!name) {
        status.innerText = '❌ Please enter your name.';
        return;
      }

      if (!navigator.geolocation) {
        status.innerText = '❌ Geolocation not supported.';
        return;
      }

      status.innerText = '📍 Getting location...';

      navigator.geolocation.getCurrentPosition(
        position => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ name, latitude, longitude }),
            headers: { 'Content-Type': 'application/json' }
          })
          .then(res => res.json())
          .then(data => {
            if (data.status === 'success') {
              if (data.locationMatch === '✅') {
                status.innerText = '✅ Attendance recorded successfully!';
              } else {
                status.innerText = '⚠️ Attendance recorded, but location is outside allowed area.';
              }
            } else if (data.status === 'already_marked') {
              status.innerText = '📌 You have already marked attendance today.';
            } else {
              status.innerText = '❌ Unexpected error occurred.';
            }
          })
          .catch(() => {
            status.innerText = '❌ Failed to submit. Try again.';
          });
        },
        error => {
          status.innerText = '❌ Location access denied or unavailable.';
        }
      );
    }
  </script>
</body>
</html>
