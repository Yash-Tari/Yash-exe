<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Taalchakra Attendance</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
    }
    input, button {
      font-size: 1.2rem;
      padding: 0.5rem;
      margin: 0.5rem;
    }
    #status {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Taalchakra Attendance 001</h2>
  <p>Please enter your name and click Submit</p>

  <input type="text" id="nameInput" placeholder="Enter your name" required />
  <br>
  <button onclick="submitAttendance()">Submit Attendance</button>

  <p id="status"></p>

  <script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzek8wbWkUh_Mi5ASm42h5zZS84oPJsZFcGl_G0b64a-pbkv8CNO0gDnBSUqz4ezBfJAA/exec'; // Replace with your NEW working URL

  async function submitAttendance() {
    const name = document.getElementById('nameInput').value.trim();
    const status = document.getElementById('status');
    
    if (!name) {
      status.innerText = '❌ Please enter your name.';
      return;
    }

    if (!navigator.geolocation) {
      status.innerText = '❌ Geolocation not supported.';
      return;
    }

    status.innerText = '📍 Getting location...';

    navigator.geolocation.getCurrentPosition(async position => {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, latitude, longitude })
        });

        const data = await response.json();
        console.log("Server response:", data); // 👈 logs real output

        if (data.status === 'success') {
          if (data.locationMatch === '✅') {
            status.innerText = '✅ Attendance recorded successfully!';
          } else {
            status.innerText = '⚠️ Attendance recorded, but location is outside allowed area.';
          }
        } else if (data.status === 'already_marked') {
          status.innerText = '📌 You have already marked attendance today.';
        } else if (data.status === 'error') {
          status.innerText = `❌ Server error: ${data.message}`;
        } else {
          status.innerText = '❌ Unknown server response.';
        }

      } catch (err) {
        console.error("Fetch failed:", err);
        status.innerText = `❌ Network error: ${err.message}`;
      }

    }, error => {
      console.error("Geolocation error:", error);
      status.innerText = '❌ Location access denied or unavailable.';
    });
  }
</script>

</body>
</html>
