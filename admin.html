<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin - Set Attendance Location</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
      background-color: #cc3300;
      color: #fff;
    }
    input, button {
      font-size: 1.2rem;
      padding: 0.5rem;
      margin: 0.5rem;
      border-radius: 5px;
    }
    #status {
      margin-top: 1rem;
      font-weight: bold;
    }
    iframe {
      display: none;
    }
  </style>
</head>
<body>
  <h2>Admin Panel – Set Attendance Location</h2>
  <p>Enter new latitude and longitude:</p>

  <form id="locationForm" target="hiddenFrame" method="GET"
    action="https://script.google.com/macros/s/AKfycbzek8wbWkUh_Mi5ASm42h5zZS84oPJsZFcGl_G0b64a-pbkv8CNO0gDnBSUqz4ezBfJAA/exec"
    onsubmit="document.getElementById('status').innerText = '⏳ Updating...';">
    <input type="text" name="lat" placeholder="Latitude" required /><br>
    <input type="text" name="lng" placeholder="Longitude" required /><br>
    <button type="submit">Update Location</button>
  </form>

  <p id="status">✅ Ready to update location</p>
  <iframe name="hiddenFrame" onload="document.getElementById('status').innerText = '✅ Location updated successfully!'"></iframe>
</body>
</html>
