<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin - Set Attendance Location</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
      background-color: #cc3300;
      color: #fff;
    }
    input, button {
      font-size: 1.2rem;
      padding: 0.5rem;
      margin: 0.5rem;
      border-radius: 5px;
      border: none;
    }
    #status {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Admin Panel – Set Attendance Location</h2>
  <p>Enter or auto-detect latitude and longitude:</p>

  <input type="text" id="lat" placeholder="Latitude" required /><br>
  <input type="text" id="lng" placeholder="Longitude" required /><br>

  <button onclick="updateLocation()">Update Location</button>
  <button onclick="getCurrentLocation()">Get Current Location</button>

  <p id="status">📍 Loading configured location from sheet...</p>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzek8wbWkUh_Mi5ASm42h5zZS84oPJsZFcGl_G0b64a-pbkv8CNO0gDnBSUqz4ezBfJAA/exec';

    // Load configured location from Sheet on load
    window.onload = () => {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          document.getElementById("lat").value = data.lat;
          document.getElementById("lng").value = data.lng;
          document.getElementById('status').innerText = `📍 Loaded configured location: ${data.lat}, ${data.lng}`;
        })
        .catch(err => {
          document.getElementById('status').innerText = '⚠️ Failed to load location from sheet.';
          console.error(err);
        });
    };

    function getCurrentLocation() {
      const status = document.getElementById('status');
      if (navigator.geolocation) {
        status.innerText = '📡 Getting current location...';
        navigator.geolocation.getCurrentPosition(
          position => {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);
            document.getElementById('lat').value = lat;
            document.getElementById('lng').value = lng;
            status.innerText = `📍 Auto-filled current location: ${lat}, ${lng}`;
          },
          error => {
            status.innerText = '❌ Failed to get location.';
            console.error(error);
          }
        );
      } else {
        status.innerText = '❌ Geolocation not supported in this browser.';
      }
    }

    function updateLocation() {
      const lat = document.getElementById("lat").value.trim();
      const lng = document.getElementById("lng").value.trim();
      const status = document.getElementById("status");

      if (!lat || !lng) {
        status.innerText = "❌ Please enter both latitude and longitude.";
        return;
      }

      status.innerText = "⏳ Updating location...";
      fetch(`${SCRIPT_URL}?lat=${lat}&lng=${lng}`)
        .then(res => res.text())
        .then(data => {
          status.innerText = data.includes("✅") ? `✅ ${data}` : `⚠️ ${data}`;
        })
        .catch(err => {
          status.innerText = `❌ Error: ${err.message}`;
          console.error(err);
        });
    }
  </script>
</body>
</html>
