<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin - Set Attendance Location</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #cc3300;
    color: #fff;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .panel {
    background-color: #fff;
    color: #333;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    width: 90%;
    max-width: 500px;
    text-align: center;
    position: relative;
  }

  .logo {
    width: 160px;
    margin-bottom: 1rem;
  }

  h2 {
    color: #cc3300;
    margin-top: 0;
  }

  input {
    width: 90%;
    font-size: 1.1rem;
    padding: 0.6rem;
    margin: 0.5rem 0;
    border: 1px solid #ccc;
    border-radius: 8px;
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  button {
    font-size: 0.95rem;
    padding: 0.6rem 1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    flex: 1 1 45%;
    min-width: 120px;
  }

  .btn-primary {
    background-color: #cc3300;
    color: #fff;
  }

  .btn-secondary {
    background-color: #e65c00;
    color: #fff;
  }

  .btn-outline {
    background-color: transparent;
    border: 2px solid #cc3300;
    color: #cc3300;
  }

  .btn-outline:hover {
    background-color: #cc3300;
    color: #fff;
  }

  #status {
    margin-top: 1rem;
    font-weight: bold;
    color: #cc3300;
  }

  .hidden {
    display: none;
  }

  /* 🔁 Responsive styles */
  @media (max-width: 480px) {
    .panel {
      padding: 1.5rem 1rem;
    }

    .logo {
      width: 130px;
    }
    input {
      font-size: 1.05rem;
      padding: 0.7rem;
    }

    input {
      width: 100%;
    }

    button {
      font-size: 1.05rem;
      padding: 0.75rem;
      flex: 1 1 100%;
    }
    .buttons {
      flex-direction: column;
      gap: 0.6rem;
    }
  }
</style>

</head>
<body>
  <div class="panel" id="adminPanel">
    <img src="Taalchakra Logo_Maroon_2024.png" alt="Taalchakra Logo" class="logo">
    <h2>Admin Panel – Set Attendance Location</h2>
    <p>Enter or auto-detect latitude and longitude:</p>

    <input type="text" id="lat" placeholder="Latitude" required /><br>
    <input type="text" id="lng" placeholder="Longitude" required /><br>

    <div class="buttons">
      <button class="btn-primary" onclick="updateLocation()">Update</button>
      <button class="btn-secondary" onclick="getCurrentLocation()">Get Location</button>
      <button class="btn-outline" onclick="clearFields()">Clear</button>
      <button class="btn-outline" onclick="openSheet()">View Sheet</button>
      <button class="btn-outline" onclick="closePanel()">Close</button>
    </div>

    <p id="status">📍 Loading configured location from sheet...</p>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzek8wbWkUh_Mi5ASm42h5zZS84oPJsZFcGl_G0b64a-pbkv8CNO0gDnBSUqz4ezBfJAA/exec';
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1qjJ7XCxvoWLQRPocrD8C_p_10EZwthVVD813nEiE_4w/edit?usp=sharing'; // Replace with actual sheet URL

    window.onload = () => {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          document.getElementById("lat").value = data.lat;
          document.getElementById("lng").value = data.lng;
          document.getElementById('status').innerText = `📍 Loaded configured location: ${data.lat}, ${data.lng}`;
        })
        .catch(err => {
          document.getElementById('status').innerText = '⚠️ Failed to load location from sheet.';
          console.error(err);
        });
    };

    function getCurrentLocation() {
      const status = document.getElementById('status');
      if (navigator.geolocation) {
        status.innerText = '📡 Getting current location...';
        navigator.geolocation.getCurrentPosition(
          position => {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);
            document.getElementById('lat').value = lat;
            document.getElementById('lng').value = lng;
            status.innerText = `📍 Auto-filled current location: ${lat}, ${lng}`;
          },
          error => {
            status.innerText = '❌ Failed to get location.';
            console.error(error);
          }
        );
      } else {
        status.innerText = '❌ Geolocation not supported in this browser.';
      }
    }

    function updateLocation() {
      const lat = document.getElementById("lat").value.trim();
      const lng = document.getElementById("lng").value.trim();
      const status = document.getElementById("status");

      if (!lat || !lng) {
        status.innerText = "❌ Please enter both latitude and longitude.";
        return;
      }

      status.innerText = "⏳ Updating location...";
      fetch(`${SCRIPT_URL}?lat=${lat}&lng=${lng}`)
        .then(res => res.text())
        .then(data => {
          status.innerText = data.includes("✅") ? `✅ ${data}` : `⚠️ ${data}`;
        })
        .catch(err => {
          status.innerText = `❌ Error: ${err.message}`;
          console.error(err);
        });
    }

    function clearFields() {
      document.getElementById('lat').value = '';
      document.getElementById('lng').value = '';
      document.getElementById('status').innerText = '🧹 Cleared fields.';
    }

    function openSheet() {
      window.open(SHEET_URL, '_blank');
    }

function closePanel() {
  if (window.confirm("Are you sure you want to close this tab?")) {
    window.close();

    // Fallback: hide panel if tab can't be closed
    setTimeout(() => {
      document.getElementById('adminPanel').classList.add('hidden');
    }, 200);
  }
}
  </script>
</body>
</html>
