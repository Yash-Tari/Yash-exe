<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Export Attendance PDF</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fefefe;
      color: #333;
      padding: 2rem;
      text-align: center;
    }

    h2 {
      color: #cc3300;
    }

    input[type="date"] {
      font-size: 1.2rem;
      padding: 0.6rem;
      margin: 1rem 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      font-size: 1rem;
      padding: 0.6rem 1rem;
      background-color: #cc3300;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #b12c00;
    }
  </style>
</head>
<body>
  <h2>Export Attendance PDF 5</h2>
  <input type="date" id="exportDate" required />
  <br>
  <button onclick="downloadPDF()">Download PDF</button>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzek8wbWkUh_Mi5ASm42h5zZS84oPJsZFcGl_G0b64a-pbkv8CNO0gDnBSUqz4ezBfJAA/exec";

    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('exportDate').value = today;
    });

    function downloadPDF() {
      const date = document.getElementById("exportDate").value;
      if (!date) {
        alert("Please select a date");
        return;
      }

      const url = `${SCRIPT_URL}?mode=getPdfData&date=${date}`;
      window.open(url, "_blank"); // open PDF in new tab
    }
  </script>
</body>
</html>
