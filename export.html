<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Export Attendance PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fefefe;
      color: #333;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }

    h2 {
      color: #cc3300;
    }

    input[type="date"] {
      font-size: 1.2rem;
      padding: 0.6rem;
      margin: 1rem 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      font-size: 1rem;
      padding: 0.6rem 1rem;
      background-color: #cc3300;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 0.5rem;
    }

    button:hover {
      background-color: #b12c00;
    }

    #status {
      margin-top: 1rem;
      font-weight: bold;
    }

    a.back {
      display: block;
      margin-top: 2rem;
      color: #cc3300;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>Export Attendance PDF 1</h2>
  <input type="date" id="exportDate" required />
  <br>
  <button onclick="downloadPDF()">Download PDF</button>

  <p id="status"></p>

  <a href="admin.html" class="back">⬅ Back to Admin Panel</a>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzek8wbWkUh_Mi5ASm42h5zZS84oPJsZFcGl_G0b64a-pbkv8CNO0gDnBSUqz4ezBfJAA/exec';

    // ✅ Auto-fill today's date when DOM is ready
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('exportDate').value = today;
    });

    async function downloadPDF() {
      const date = document.getElementById('exportDate').value;
      const status = document.getElementById('status');

      if (!date) {
        alert("Please select a date.");
        return;
      }

      status.textContent = "⏳ Fetching data...";

      try {
        const res = await fetch(`${SCRIPT_URL}?date=${date}`);
        const json = await res.json();

        if (json.status !== "success") {
          status.textContent = `❌ ${json.message}`;
          return;
        }

        const data = json.data;
        if (!data || data.length === 0) {
          status.textContent = "⚠️ No attendance records found for this date.";
          return;
        }

        // ✅ Use correct jsPDF reference
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFontSize(16);
        doc.text(`Attendance Report – ${date}`, 14, 20);

        doc.setFontSize(12);
        let y = 30;

        doc.text("Name | Attendance | Time | Location", 14, y);
        y += 8;

        for (const row of data) {
          const line = `${row.name} | ${row.attendance || "-"} | ${row.time || "-"} | ${row.location || "-"}`;
          doc.text(line, 14, y);
          y += 8;

          if (y > 270) {
            doc.addPage();
            y = 20;
          }
        }

        doc.save(`Attendance_${date}.pdf`);
        status.textContent = "✅ PDF downloaded successfully.";
      } catch (err) {
        console.error(err);
        status.textContent = "❌ Failed to generate PDF.";
      }
    }
  </script>
</body>
</html>
