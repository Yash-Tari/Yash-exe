<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Form</title>
  <script>
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          document.getElementById('latitude').value = position.coords.latitude;
          document.getElementById('longitude').value = position.coords.longitude;
        }, function(error) {
          alert("Error getting location: " + error.message);
        });
      } else {
        alert("Geolocation is not supported by this browser.");
      }
    }

    function onFormSubmit() {
      // Ensure that the location is populated before submission
      if (!document.getElementById('latitude').value || !document.getElementById('longitude').value) {
        alert("Please allow location access.");
        return false;
      }
      return true;
    }

    // Call getLocation on page load to automatically populate the fields
    window.onload = getLocation;
  </script>
</head>
<body>
  <form id="locationForm" action="YOUR_GOOGLE_FORM_URL_HERE" method="POST" onsubmit="return onFormSubmit()">
    <label for="name">Your Name:</label>
    <input type="text" id="name" name="entry.123456" required><br><br>

    <label for="latitude">Latitude:</label>
    <input type="text" id="latitude" name="entry.654321" readonly><br><br>

    <label for="longitude">Longitude:</label>
    <input type="text" id="longitude" name="entry.987654" readonly><br><br>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
