<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Redirect</title>
</head>
<body>

<script>
  // Function to get location and redirect to Google Form
  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        var latitude = position.coords.latitude;
        var longitude = position.coords.longitude;

        // Google Form URL
        var googleFormUrl = "https://docs.google.com/forms/d/e/1FAIpQLSd3tatQNfrJVt3T_1adV8d_egWQKElUll5Tw0bPzWf98n6yVA/viewform";
        
        // Dynamically find the input fields using jsname
        var latitudeInputField = document.querySelector("[jsname='YPqjbf']");

        // If the input field exists, populate it with the latitude or longitude
        if (latitudeInputField) {
          // Assuming the first field is for Latitude
          latitudeInputField.value = latitude;
        }

        // Construct the URL with dynamic query parameters for Latitude and Longitude
        googleFormUrl += "?entry.123456=" + latitude + "&entry.789101=" + longitude;

        // Redirect to the Google Form with the location populated
        window.location.href = googleFormUrl;
      }, function(error) {
        alert("Location access denied or unavailable.");
      });
    } else {
      alert("Geolocation is not supported by this browser.");
    }
  }

  // Call the function to get the location and redirect
  getLocation();
</script>

</body>
</html>
