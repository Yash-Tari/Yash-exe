<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Redirect</title>
</head>
<body>

<script>
  // Function to get location and auto-fill the form
  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        var latitude = position.coords.latitude;
        var longitude = position.coords.longitude;

        // Find the Latitude input field using the jsname attribute
        var latitudeInput = document.querySelector("[jsname='YPqjbf']");

        // If the input field is found, fill it with latitude
        if (latitudeInput) {
          latitudeInput.value = latitude;
        }

        // Optionally, you can log or alert the values to verify
        console.log("Latitude: " + latitude);
        console.log("Longitude: " + longitude);

        // Construct Google Form URL with dynamic query parameters for Latitude and Longitude
        var googleFormUrl = "https://docs.google.com/forms/d/e/1FAIpQLSd3tatQNfrJVt3T_1adV8d_egWQKElUll5Tw0bPzWf98n6yVA/viewform";
        googleFormUrl += "?entry.123456=" + latitude + "&entry.789101=" + longitude; // Replace entry IDs with actual ones

        // Redirect to the form with pre-filled data
        window.location.href = googleFormUrl;
      }, function(error) {
        alert("Location access denied or unavailable.");
      });
    } else {
      alert("Geolocation is not supported by this browser.");
    }
  }

  // Call the function to get the location and auto-fill
  getLocation();
</script>

</body>
</html>
