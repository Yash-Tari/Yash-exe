<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Redirect</title>
</head>
<body>

<script>
  // Function to get location and redirect to Google Form
  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        var latitude = position.coords.latitude;
        var longitude = position.coords.longitude;

        // Google Form URL with location data appended
        var googleFormUrl = "https://docs.google.com/forms/d/e/1FAIpQLSd3tatQNfrJVt3T_1adV8d_egWQKElUll5Tw0bPzWf98n6yVA/viewform";
        
        // Append latitude and longitude to the Google Form URL
        googleFormUrl += "?entry.123456=" + latitude;  // Replace "entry.123456" with the actual entry ID for latitude
        googleFormUrl += "&entry.789101=" + longitude;  // Replace "entry.789101" with the actual entry ID for longitude

        // Redirect to the Google Form
        window.location.href = googleFormUrl;
      }, function(error) {
        alert("Location access denied or unavailable.");
      });
    } else {
      alert("Geolocation is not supported by this browser.");
    }
  }

  // Call the function to get the location and redirect
  getLocation();
</script>

</body>
</html>
